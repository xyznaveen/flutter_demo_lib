name: Publish to pub.dev

# Manual only: Actions > Publish to pub.dev > Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Must match pubspec.yaml, for example 0.0.2.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify version and branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manual publish request
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)
          if [ "$INPUT_VERSION" != "$version" ]; then
            echo "Input version '$INPUT_VERSION' does not match pubspec version '$version'." >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/heads/master|refs/heads/main) ;;
            *)
              echo "Run this workflow from master or main, not $GITHUB_REF." >&2
              exit 1
              ;;
          esac
          echo "Publishing $version from $GITHUB_REF"

  publish:
    name: Publish
    needs: verify
    permissions:
      id-token: write # Required for pub.dev authentication over OIDC
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      # Must match the environment name configured on pub.dev, if one is required.
      environment: pub.dev
      use-flutter: true
