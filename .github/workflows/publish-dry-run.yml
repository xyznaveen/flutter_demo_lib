name: Publish dry run

# Manual run: validates and packages the plugin, but does not upload anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Dry run
        run: dart pub publish --dry-run
