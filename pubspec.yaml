name: flutter_demo_lib_naveen
description: A minimal Flutter plugin for Android and iOS used to test the pub.dev publishing flow from GitHub Actions.
version: 0.0.2

homepage: https://github.com/xyznaveen/flutter_demo_lib
repository: https://github.com/xyznaveen/flutter_demo_lib
issue_tracker: https://github.com/xyznaveen/flutter_demo_lib/issues

topics:
  - demo
  - plugin

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.naveen.flutter_demo_lib
        pluginClass: FlutterDemoLibPlugin
      ios:
        pluginClass: FlutterDemoLibPlugin
